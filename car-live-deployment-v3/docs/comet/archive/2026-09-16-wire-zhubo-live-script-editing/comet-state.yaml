acceptance:
  - id: A1
    source: brief.md
    text: "A1:
      直播台新增“实时话术”条目表，逐条显示编号/状态/话术；可选中条目编辑文本、在指定编号之后新增条目、删除条目；条目来自后端会话而不是仅存在于浏览器\
      内存。"
    result: passed
    reason:
      text: Backend owns an ordered session_ioms item list returned by the session
        API, and the 直播台 renders 编号/状态/话术 with row select, edit, add-after and
        delete; backend CRUD is covered by test_live_session_items. Verified in
        the previous independent full verification on this same candidate.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 修改正在播报的条目会立即中断该条，并从修订文本的开头重新播报，然后按顺序继续后续条目。"
    result: passed
    reason:
      text: "Editing the playing item interrupts it: run.revision bump, in-flight
        abort, scheduled sources stopped, and regeneration from that item's
        first phrase. Verified in the previous independent full verification."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 修改尚未播报的条目就地替换文本，不打断当前播报，轮到该条时播出新文本。"
    result: passed
    reason:
      text: Editing an unplayed item replaces text in place and discards only its
        not-yet-audible audio without touching the audible source. Verified in
        the previous independent full verification.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 新增条目插入到指定位置并按顺序播出，不打断当前正在播报的内容。"
    result: passed
    reason:
      text: onItemAdded clamps the insert index against the audible item and backend
        add_item floors the position past played/currently-playing rows, so
        playback order matches the 编号 table; covered by
        test_add_after_played_item_lands_after_the_playing_item and a headless
        add-position probe.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 删除尚未播报的条目会将其移除；删除正在播报的条目会中断它并继续下一条。"
    result: passed
    reason:
      text: Delete removes a queued item and its audio; deleting the playing item
        interrupts it and continues with the next item. Verified in the previous
        independent full verification.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 任何改稿之后，为被替换文本已经合成但尚未播出的音频都不会被播出。"
    result: passed
    reason:
      text: "Superseded audio never reaches the queue: revision checks before flush
        plus stopSourcesFromIndex/discardUnplayedSources. Verified in the
        previous independent full verification."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 已经播完的条目禁止修改或删除，界面给出提示，后端也拒绝该操作。"
    result: passed
    reason:
      text: Played rows disable edit/delete with a hint and the backend returns 409
        via _require_editable_item on both edit and delete; covered by
        test_played_items_are_protected.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 浏览器播放引擎按条目 id/revision 请求与丢弃音频，过期 revision 的音频不进入播放队列。"
    result: passed
    reason:
      text: Every live request carries item_id/item_revision and stale-revision audio
        is cancelled and never queued. Verified in the previous independent full
        verification.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: 暖机后点击“开始播报”，浏览器首个有声帧在 2.0 秒内；zhubo 直播请求按短语分段流式返回，首个音频不等待整批文本合成完成。"
    result: passed
    reason:
      text: Focused verifier confirmed the streaming path is per phrase (zhubo branch
        yields unit by unit, per-item requests) and that the measurement script
        is an honest click-to-first-scheduled-buffer measure; the Runtime check
        live-first-audio ran 3 clean runs under the 2.0 s limit and passed (exit
        0).
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: IndexTTS2 与 GPT-SoVITS 的既有分批与跨句韵律行为不回归。"
    result: passed
    reason:
      text: GPT-SoVITS/IndexTTS2 keep STREAM_BATCH_UNITS=5 with stream_batch=true as
        one upstream unit and their item controls are disabled; batching/prosody
        unchanged. Verified in the previous independent full verification.
      truncated: false

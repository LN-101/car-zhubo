acceptance:
  - id: A1
    source: brief.md
    text: "A1: The WebUI accepts a script textbox and a UTF-8 script file upload;
      starting a broadcast plays on the server's local audio device and begins
      audible playback before the full script finishes synthesizing."
    result: passed
    reason:
      text: Inspected the Chinese Gradio controls, UTF-8 upload handling, empty-input
        rejection, reference-voice plumbing, reusable Engine and local PortAudio
        output. Runtime's real Gradio/GPU check passed.
        outputs/comet-verify-live records text first device output at 0.973 s
        versus synthesis completion at 43.400 s; uploaded-file output began at
        1.015 s with only the first item generated before deliberate stop.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: While a broadcast is unfinished, the UI can add, edit and delete
      script items; editing the currently playing item interrupts it
      immediately, plays the fixed text from its start and continues normally;
      editing an already-played item interrupts current playback, plays the
      corrected item in full, then resumes the interrupted position from the
      exact interruption point and continues in order; queued edits and inserts
      update in place without interrupting; deleting the playing item interrupts
      it and continues with the next item."
    result: passed
    reason:
      text: Session scheduling and Runtime-passed deterministic tests cover
        current-item restart, queued edits/inserts without interruption,
        current/queued/played deletion, boundary correction, nested corrections
        and editing after completion. Real GPU evidence records correction
        interrupting item 2 at frame 7168 and resuming the same segment at frame
        7168 after corrected item 1; the added item plays and the deleted queued
        item does not.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: After any edit, no audio synthesized for the replaced text is heard;
      stale queued audio for it is discarded rather than played."
    result: passed
    reason:
      text: Edits replace jobs under the callback's shared lock, invalidate in-flight
        results by job identity/revision and remove stale queued PCM.
        Deterministic PCM tests verify current restart, queued replacement,
        suspended-item replacement and stale in-flight generation rejection.
        Runtime GPU evidence marks displaced generation 1 discarded and contains
        no playback event for it.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Speed (0.5x-2.0x), volume (0-200 %) and intonation (named presets
      with intensity 0-1) change the output with hybrid activation: volume
      applies immediately to playing audio, speed and intonation apply from the
      next generated segment; applied values are observable in the UI and
      report."
    result: passed
    reason:
      text: Parameters enforce the specified ranges, map speed to
        duration_factor=1/speed and scale the named eight-dimensional tone
        vectors. Engine passes these values to IndexTTS with use_random=False
        and QwenEmotion disabled. Callback gain uses current volume with PCM16
        clipping; generation captures parameters when synthesis begins.
        Runtime-passed tests verify gain, clipping and preservation of queued
        parameters. Real GPU records include neutral, warm, energetic and steady
        generations, with applied values exposed through UI snapshots and
        reports.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Streaming and the existing CLI regress cleanly: playback starts
      before synthesis completes, warm first device output stays <= 3 s, order
      is preserved, underruns remain honestly recorded, and non-interactive CLI
      behavior is unchanged."
    result: passed
    reason:
      text: Runtime reports all 25 unit tests and both launch-help checks passed.
        Inspected CLI entry points retain --text/--file, --runs, --voice and
        --output. docs/live-edit-evidence/cli.json records two real CLI runs
        with ordered IDs 0,1,2, streaming before synthesis completion, first
        device output 0.956/1.035 s and zero underruns. Runtime WebUI evidence
        also meets the warm 3 s target and honestly records two queue underruns
        totaling 2.926 s. Tests cover bounded resident PCM, ordering,
        decimal-preserving segmentation and cancellation.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: A reproducible report records edit-response timing (control action to
      refreshed or corrected device output and to resumed playback for interrupt
      and correction edits; regeneration timing for queued edits) and applied
      parameter values, alongside the existing latency, RTF and underrun
      metrics."
    result: passed
    reason:
      text: README and docs/实时改稿测试报告.md provide reproduction commands, measurement
        definitions and linked raw evidence. Session records edit action
        timestamps, regeneration, refreshed output, continuation timing,
        interruption frames, applied generation parameters, latency, RTF and
        underruns, and saves metrics plus callback-output WAV. Runtime evidence
        includes current-edit output/continuation at 1.751/6.372 s, correction
        output/resume at 1.610/4.222 s, queued regeneration at 37.645 s and
        deletion continuation at 0.209 s. Published report values agree with its
        separate docs/live-edit-evidence run.
      truncated: false
